name: Deploy MERN App to EKS

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: arshen00r
  BACKEND_IMAGE: arshen00r/backend
  FRONTEND_IMAGE: arshen00r/frontend
  AWS_REGION: ap-south-1
  CLUSTER_NAME: mern-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Login to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3️⃣ Build & Push Backend
    - name: Build & Push Backend
      run: |
        docker build -t $BACKEND_IMAGE:latest ./backend
        docker push $BACKEND_IMAGE:latest

    # 4️⃣ Build & Push Frontend
    - name: Build & Push Frontend
      run: |
        docker build -t $FRONTEND_IMAGE:latest ./frontend
        docker push $FRONTEND_IMAGE:latest

    # 5️⃣ Configure AWS credentials (🔥 IMPORTANT)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 6️⃣ Update kubeconfig from EKS
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

    # 7️⃣ Verify cluster connection (debug step)
    - name: Verify Cluster
      run: |
        kubectl get nodes

    # 8️⃣ Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment backend -n mern-app
        kubectl rollout restart deployment frontend -n mern-app