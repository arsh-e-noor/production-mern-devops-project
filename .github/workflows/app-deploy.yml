name: Deploy MERN App to EKS

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: arshen00r
  BACKEND_IMAGE: arshen00r/backend
  FRONTEND_IMAGE: arshen00r/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout
      uses: actions/checkout@v3

    # 2️⃣ Login to DockerHub
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3️⃣ Build & Push Backend
    - name: Build Backend
      run: |
        docker build -t $BACKEND_IMAGE:latest ./backend
        docker push $BACKEND_IMAGE:latest

    # 4️⃣ Build & Push Frontend
    - name: Build Frontend
      run: |
        docker build -t $FRONTEND_IMAGE:latest ./frontend
        docker push $FRONTEND_IMAGE:latest

    # 5️⃣ Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    # 6️⃣ Configure kubeconfig
    - name: Set kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

    # 7️⃣ Deploy to Kubernetes
    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/
        kubectl rollout restart deployment backend -n mern-app
        kubectl rollout restart deployment frontend -n mern-app